# ==========================================================
# HealthLens AI - Render Blueprint Deployment
# Deploys BOTH Frontend & Backend in ONE single Docker Web Service
# ==========================================================

services:
  - type: web
    name: healthlens-ai
    env: docker
    dockerfilePath: ./DOCKERFILE
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
